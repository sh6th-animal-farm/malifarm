name: Deploy Malifarm (Full Stack)

on:
  push:
    branches: ["develop", "feat/cicd"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 백엔드 빌드 및 도커 이미지 푸시
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Build Backend with Gradle
        run: |
          cd backend
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/malifarm:latest

      # 2. 프론트엔드 빌드
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" > .env
          npm run build

      # 3. 빌드된 프론트엔드 파일을 서버로 전송 (SCP)
      - name: Copy Frontend dist to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "frontend/dist/*"
          target: "/home/minsjes/malifarm/frontend-dist"
          strip_components: 2 # 'frontend/dist/' 경로를 제거하고 파일만 전송

      # 4. 서버 접속 후 도커 컴포즈 재시작
      - name: Execute Server Command
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/minsjes/malifarm
            docker compose pull
            docker compose down
            docker compose up -d
            docker image prune -f
